# Dependabot configuration
# Version updates are grouped and batched weekly (Mondays) to reduce PR noise.
# Security updates are not affected by these groups/schedules — Dependabot
# still opens security fix PRs immediately when a vulnerability is disclosed.
# See: https://github.blog/security/supply-chain-security/tame-dependabot-group-your-updates-slow-the-cadence-keep-security-fast/

version: 2
updates:
  - package-ecosystem: "bundler"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      weekly-batch:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      weekly-batch:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      weekly-batch:
        patterns:
          - "*"
