services:
  redis:
    image: "redis:7-alpine"
    command: redis-server --appendonly yes
    volumes:
      - "redis:/data"
    restart: unless-stopped

  sidekiq:
    depends_on:
      - "redis"
    build:
      context: .
      args:
        # Set APP_UID/APP_GID in .env to run as a specific host account (default 1000)
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    env_file: .env
    command: bundle exec sidekiq
    environment:
      REDIS_URL: redis://redis:6379/0
      RAILS_ENV: production
      RUBY_YJIT_ENABLE: 1
      # Fewer glibc malloc arenas: cuts memory growth in threaded Ruby processes
      MALLOC_ARENA_MAX: 2
    restart: unless-stopped  # Add restart policy
    # Safety net: this container also launches headless Chromium and ffmpeg, which count
    # against the limit. A runaway job restarts only this container instead of the kernel
    # OOM-killing something else on the host.
    mem_limit: 2g

volumes:
  redis:

